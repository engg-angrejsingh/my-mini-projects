<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini Projects</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://github.com/engg-angrejsingh.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Mode */
            --bg-color: #e2e8f0;
            --card-bg: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --accent: #8b5cf6;
            --accent-text: #ffffff;
            --blue-dot: #3b82f6;

            --clay-shadow:
                15px 15px 30px rgba(163, 177, 198, 0.5),
                -5px -5px 15px rgba(255, 255, 255, 0.8),
                inset -6px -6px 16px rgba(0, 0, 0, 0.04),
                inset 6px 6px 16px rgba(255, 255, 255, 1);

            --clay-btn:
                8px 8px 16px rgba(139, 92, 246, 0.3),
                -4px -4px 10px rgba(255, 255, 255, 0.8),
                inset -4px -4px 10px rgba(0, 0, 0, 0.15),
                inset 4px 4px 10px rgba(255, 255, 255, 0.4);

            --clay-btn-active:
                2px 2px 5px rgba(139, 92, 246, 0.2),
                inset 4px 4px 10px rgba(0, 0, 0, 0.2),
                inset -4px -4px 10px rgba(255, 255, 255, 0.2);

            --clay-input-inset: 
                inset 4px 4px 8px rgba(163, 177, 198, 0.5), 
                inset -4px -4px 8px rgba(255, 255, 255, 0.9);
                
            --nav-bg: rgba(226, 232, 240, 0.75);
            --dropdown-bg: rgba(248, 250, 252, 0.95);
            
            /* Smooth Global Transition Variable */
            --theme-transition: background-color 0.5s ease, background 0.5s ease, color 0.5s ease, box-shadow 0.5s ease, border-color 0.5s ease;
        }

        /* Dark Mode Override */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #a78bfa;
            --accent-text: #0f172a;
            --blue-dot: #60a5fa;

            --clay-shadow:
                15px 15px 30px rgba(0, 0, 0, 0.4),
                -5px -5px 15px rgba(255, 255, 255, 0.05),
                inset -6px -6px 16px rgba(0, 0, 0, 0.2),
                inset 6px 6px 16px rgba(255, 255, 255, 0.05);

            --clay-btn:
                8px 8px 16px rgba(0, 0, 0, 0.4),
                -4px -4px 10px rgba(255, 255, 255, 0.05),
                inset -4px -4px 10px rgba(0, 0, 0, 0.3),
                inset 4px 4px 10px rgba(255, 255, 255, 0.1);

            --clay-btn-active:
                2px 2px 5px rgba(0, 0, 0, 0.5),
                inset 4px 4px 10px rgba(0, 0, 0, 0.4),
                inset -4px -4px 10px rgba(255, 255, 255, 0.05);

            --clay-input-inset: 
                inset 4px 4px 8px rgba(0, 0, 0, 0.5), 
                inset -4px -4px 8px rgba(255, 255, 255, 0.05);

            --nav-bg: rgba(15, 23, 42, 0.75);
            --dropdown-bg: rgba(30, 41, 59, 0.95);
        }

        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: var(--theme-transition);
        }

        /* --- Top Navigation --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            position: sticky;
            top: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            transition: var(--theme-transition);
        }

        .nav-logo {
            display: flex;
            align-items: center;
        }

        .nav-logo img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: var(--clay-shadow);
            border: 2px solid var(--accent);
            transition: transform 0.3s ease, var(--theme-transition);
            cursor: pointer;
        }

        .nav-logo img:hover {
            transform: scale(1.05);
        }

        .nav-search {
            flex-grow: 1;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
        }

        .nav-search input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 25px;
            border: none;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-family: "Poppins", sans-serif;
            font-size: 14px;
            box-shadow: var(--clay-input-inset);
            outline: none;
            transition: var(--theme-transition);
            box-sizing: border-box;
        }

        .nav-search input::placeholder {
            color: var(--text-muted);
        }

        .nav-search input:focus {
            box-shadow: var(--clay-shadow);
        }

        .nav-search svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            transition: stroke 0.5s ease;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* --- Notification Dropdown --- */
        .notification-wrapper {
            position: relative;
        }

        .notification-dropdown {
            position: absolute;
            top: 60px;
            right: 0;
            width: 300px;
            background: var(--dropdown-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: var(--clay-shadow);
            padding: 15px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s, var(--theme-transition);
            z-index: 200;
        }

        .notification-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .notif-header {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--text-main);
        }

        .notif-item {
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
            transition: var(--theme-transition);
        }

        .notif-item strong {
            display: block;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .notif-item p {
            margin: 0;
            color: var(--text-main);
            font-family: monospace;
            background: rgba(0,0,0,0.05);
            padding: 4px 6px;
            border-radius: 4px;
            word-wrap: break-word;
        }

        [data-theme="dark"] .notif-item p {
            background: rgba(255,255,255,0.05);
        }

        .notif-time {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
        }

        /* --- Buttons --- */
        .icon-btn {
            background-color: var(--card-bg);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--clay-shadow);
            transition: transform 0.3s ease, var(--theme-transition);
            color: var(--text-main);
            position: relative;
        }

        .icon-btn:hover {
            transform: scale(1.05);
        }

        .icon-btn:active {
            transform: scale(0.95);
            box-shadow: var(--clay-btn-active);
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .blue-dot {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 8px;
            height: 8px;
            background-color: var(--blue-dot);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--blue-dot);
            transition: opacity 0.3s ease;
        }

        /* --- Header / Hero --- */
        header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
            letter-spacing: -1px;
            transition: var(--theme-transition);
        }

        header h2 {
            font-size: 24px;
            font-weight: 500;
            color: var(--accent);
            margin: 10px 0;
            transition: color 0.5s ease;
        }

        header p {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 18px;
            transition: var(--theme-transition);
        }

        /* --- Project Grid --- */
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 45px;
            padding: 40px;
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: calc(100% - 80px);
        }

        .card {
            background-color: var(--card-bg);
            padding: 35px 25px;
            border-radius: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--clay-shadow);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), var(--theme-transition);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            transition: var(--theme-transition);
        }

        .card p {
            flex-grow: 1;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 25px;
            transition: var(--theme-transition);
        }

        .card button {
            margin-top: auto;
            padding: 14px 28px;
            background-color: var(--accent);
            color: var(--accent-text);
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            font-size: 15px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: var(--clay-btn);
            transition: transform 0.2s ease, var(--theme-transition);
        }

        .card button:hover,
        .card button:active {
            transform: scale(0.95);
            box-shadow: var(--clay-btn-active);
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-size: 18px;
            font-weight: 500;
            padding: 40px;
        }

        /* --- Loader --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            transition: var(--theme-transition);
        }

        .spinner {
            width: 70px;
            height: 70px;
            background-color: var(--card-bg);
            border-radius: 50%;
            box-shadow: var(--clay-shadow);
            position: relative;
            animation: bounceSpin 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        .spinner::after {
            content: "";
            position: absolute;
            top: 15px;
            left: 15px;
            width: 15px;
            height: 15px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: inset -2px -2px 4px rgba(0, 0, 0, 0.2), inset 2px 2px 4px rgba(255, 255, 255, 0.6);
        }

        #loader p {
            margin-top: 30px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 18px;
        }

        @keyframes bounceSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Typing cursor */
        .cursor {
            color: var(--accent);
            font-weight: bold;
            margin-left: 3px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- Footer & Socials --- */
        footer {
            text-align: center;
            padding: 30px 20px 40px;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: var(--theme-transition);
        }

        .social-links {
            display: flex;
            gap: 20px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--card-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            box-shadow: var(--clay-shadow);
            transition: transform 0.3s ease, color 0.3s ease, var(--theme-transition);
            text-decoration: none;
        }

        .social-icon:hover {
            transform: translateY(-6px) scale(1.05);
            color: var(--accent);
        }

        .social-icon:active {
            transform: scale(0.95);
            box-shadow: var(--clay-btn-active);
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: fill 0.3s ease;
        }

        .footer-text {
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Sun / Moon Display Logic */
        [data-theme="dark"] .sun-icon { display: none; }
        [data-theme="light"] .moon-icon { display: none; }
        
        /* Mobile Adjustments */
        @media (max-width: 768px) {
            nav { padding: 15px 20px; flex-wrap: wrap; gap: 15px; }
            .nav-search { order: 3; max-width: 100%; margin: 0; }
            .nav-actions { order: 2; }
            .projects { padding: 20px; width: calc(100% - 40px); }
            .notification-dropdown { right: -50px; }
        }
    </style>
</head>

    <script>
        // --- Dark/Light Mode Logic ---
        const themeToggleBtn = document.getElementById("themeToggleBtn");
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        let currentTheme = localStorage.getItem('theme');

        if (!currentTheme) {
            currentTheme = systemPrefersDark.matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', currentTheme);

        themeToggleBtn.addEventListener("click", () => {
            currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            
            // Spin animation
            themeToggleBtn.querySelector('svg:not([style*="display: none"])').style.transform = 'rotate(360deg)';
            setTimeout(() => {
                themeToggleBtn.querySelectorAll('svg').forEach(svg => svg.style.transform = 'none');
            }, 500);
        });

        systemPrefersDark.addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                const newTheme = e.matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
            }
        });

        // --- Notification Logic ---
        const notifBtn = document.getElementById("notifBtn");
        const notifDropdown = document.getElementById("notifDropdown");
        const notifDot = document.getElementById("notifDot");

        notifBtn.addEventListener("click", (e) => {
            e.stopPropagation(); // Prevent closing immediately
            notifDropdown.classList.toggle("show");
            // Hide the blue dot permanently once clicked
            if (notifDot) notifDot.style.opacity = '0';
        });

        // Close dropdown when clicking anywhere else
        document.addEventListener("click", (e) => {
            if (!notifDropdown.contains(e.target) && e.target !== notifBtn) {
                notifDropdown.classList.remove("show");
            }
        });

        // --- Projects Data & Search Logic ---
        const projectsData = [
            { title: "Calculator", description: "Simple web calculator for basic arithmetic.", url: "./Calculator/" },
            { title: "To-Do List", description: "Task manager to add and manage daily tasks.", url: "./Todo-List/" },
            { title: "Rock Paper Scissor", description: "Play the classic game against the computer.", url: "./Rock_Paper_Scissor/" },
            { title: "Bubble Hit Game", description: "Hit the correct bubble before the timer runs out.", url: "./Bubble_Hit_Game/" },
            { title: "Image Editor", description: "Edit images instantly with powerful canvas filters", url: "./Image-Editor/" },
            { title: "Typing Game", description: "Test how fast you can type with this dynamic speed test.", url: "./Typing_Game/" }
        ];

        const projectContainer = document.getElementById("project-container");
        const searchInput = document.getElementById("searchInput");

        function renderProjects(filterText = "") {
            projectContainer.innerHTML = "";
            const filteredData = projectsData.filter(p => 
                p.title.toLowerCase().includes(filterText.toLowerCase()) || 
                p.description.toLowerCase().includes(filterText.toLowerCase())
            ).sort((a, b) => a.title.localeCompare(b.title));

            if (filteredData.length === 0) {
                projectContainer.innerHTML = `<p class="no-results">No projects found matching "${filterText}"</p>`;
                return;
            }

            filteredData.forEach(project => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <h2>${project.title}</h2>
                    <p>${project.description}</p>
                    <button class="view-btn" data-url="${project.url}">View Project</button>
                `;
                projectContainer.appendChild(card);
            });
        }

        renderProjects();

        searchInput.addEventListener("input", (e) => {
            renderProjects(e.target.value);
        });

        document.addEventListener("DOMContentLoaded", () => {
            const loader = document.getElementById("loader");

            if (loader) {
                loader.style.display = "flex";
                setTimeout(() => {
                    loader.style.display = "none";
                }, 700);
            }

            document.addEventListener("click", function (e) {
                if (e.target.classList.contains("view-btn")) {
                    const url = e.target.dataset.url;
                    if (loader) loader.style.display = "flex";
                    setTimeout(() => {
                        window.location.href = url;
                    }, 700);
                }
            });

            // Typing effect
            const words = [
                "C • C++ • Java • Python • JavaScript",
                "Frontend Developer",
                "JavaScript Developer",
                "Building Web Projects",
                "Web Developer"
            ];

            const typingElement = document.getElementById("typing");

            if (typingElement) {
                let wordIndex = 0;
                let charIndex = 0;
                let deleting = false;

                function typeEffect() {
                    const word = words[wordIndex];

                    if (!deleting) {
                        typingElement.textContent = word.substring(0, charIndex++);
                        if (charIndex > word.length) {
                            deleting = true;
                            setTimeout(typeEffect, 1500);
                            return;
                        }
                    } else {
                        typingElement.textContent = word.substring(0, charIndex--);
                        if (charIndex < 0) {
                            deleting = false;
                            wordIndex = (wordIndex + 1) % words.length;
                        }
                    }
                    setTimeout(typeEffect, deleting ? 50 : 120);
                }
                typeEffect();
            }
        });

        window.addEventListener("pageshow", function () {
            const loader = document.getElementById("loader");
            if (loader) loader.style.display = "none";
        });
    </script>
</body>

</html>
