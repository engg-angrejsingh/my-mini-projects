<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3567492819156221"
        crossorigin="anonymous"></script>
    <style>
        :root {
            /* Claymorphism Variables */
            --bg-color: #e2e8f0;
            /* Soft pastel gray-blue background */
            --card-bg: #f8fafc;
            /* Pure, slightly warm white for clay items */
            --text-main: #334155;
            --text-muted: #64748b;

            /* Vibrant Accent for Buttons */
            --accent: #8b5cf6;
            /* Soft Violet */
            --accent-text: #ffffff;

            /* Claymorphism Shadows (Outer Drop + Inner Inset) */
            --clay-shadow:
                15px 15px 30px rgba(163, 177, 198, 0.5),
                -5px -5px 15px rgba(255, 255, 255, 0.8),
                inset -6px -6px 16px rgba(0, 0, 0, 0.04),
                inset 6px 6px 16px rgba(255, 255, 255, 1);

            --clay-btn:
                8px 8px 16px rgba(139, 92, 246, 0.3),
                -4px -4px 10px rgba(255, 255, 255, 0.8),
                inset -4px -4px 10px rgba(0, 0, 0, 0.15),
                inset 4px 4px 10px rgba(255, 255, 255, 0.4);

            --clay-btn-active:
                2px 2px 5px rgba(139, 92, 246, 0.2),
                inset 4px 4px 10px rgba(0, 0, 0, 0.2),
                inset -4px -4px 10px rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        header p {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 18px;
        }

        /* Project Grid */
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 45px;
            padding: 40px;
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: calc(100% - 80px);
        }

        /* Claymorphic Card */
        .card {
            background-color: var(--card-bg);
            padding: 35px 25px;
            border-radius: 40px;
            /* Super rounded corners for clay look */
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--clay-shadow);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Hover float effect */
        .card:hover {
            transform: translateY(-8px) scale(1.02);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .card p {
            flex-grow: 1;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 25px;
        }

        /* Claymorphic Button */
        .card button {
            margin-top: auto;
            padding: 14px 28px;
            background-color: var(--accent);
            color: var(--accent-text);
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            border: none;
            border-radius: 25px;
            /* Pill shape */
            cursor: pointer;
            box-shadow: var(--clay-btn);
            transition: all 0.2s ease;
        }

        /* Squish effect on hover/click */
        .card button:hover,
        .card button:active {
            transform: scale(0.95);
            box-shadow: var(--clay-btn-active);
        }

        /* Loading Overlay */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(226, 232, 240, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        /* Clay Spinner */
        .spinner {
            width: 70px;
            height: 70px;
            background-color: var(--card-bg);
            border-radius: 50%;
            box-shadow: var(--clay-shadow);
            position: relative;
            animation: bounceSpin 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        .spinner::after {
            content: "";
            position: absolute;
            top: 15px;
            left: 15px;
            width: 15px;
            height: 15px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: inset -2px -2px 4px rgba(0, 0, 0, 0.2), inset 2px 2px 4px rgba(255, 255, 255, 0.6);
        }

        #loader p {
            margin-top: 30px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 18px;
        }

        @keyframes bounceSpin {
            0% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.1);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        /* Typing cursor */
        .cursor {
            color: var(--accent);
            font-weight: bold;
            margin-left: 3px;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Hi, I'm Angrej Singh</h1>
        <h2><span id="typing"></span><span class="cursor">|</span></h2>
        <p>Collection of small web development projects</p>
    </header>

    <section class="projects" id="project-container"></section>

    <div id="loader">
        <div class="spinner"></div>
        <p>Loading project...</p>
    </div>

    <footer>
        <p>Made by Angrej Singh</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loader = document.getElementById("loader");

            if (loader) {
                loader.style.display = "flex";
                setTimeout(() => {
                    loader.style.display = "none";
                }, 700);
            }

            const projectsData = [
                { title: "Calculator", description: "Simple web calculator for basic arithmetic.", url: "./Calculator/" },
                { title: "To-Do List", description: "Task manager to add and manage daily tasks.", url: "./Todo-List/" },
                { title: "Rock Paper Scissor", description: "Play the classic game against the computer.", url: "./Rock_Paper_Scissor/" },
                { title: "Bubble Hit Game", description: "Hit the correct bubble before the timer runs out.", url: "./Bubble_Hit_Game/" },
                { title: "Image Editor", description: "Edit images instantly with powerful canvas filters", url: "./Image-Editor/" },
                { title: "Typing Game", description: "Test how fast you can type with this dynamic speed test.", url: "./Typing_Game/" }
            ];

            const projectContainer = document.getElementById("project-container");

            projectsData
                .sort((a, b) => a.title.localeCompare(b.title))
                .forEach(project => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <h2>${project.title}</h2>
                        <p>${project.description}</p>
                        <button class="view-btn" data-url="${project.url}">View Project</button>
                    `;
                    projectContainer.appendChild(card);
                });

            document.addEventListener("click", function (e) {
                if (e.target.classList.contains("view-btn")) {
                    const url = e.target.dataset.url;
                    if (loader) loader.style.display = "flex";
                    setTimeout(() => {
                        window.location.href = url;
                    }, 700);
                }
            });

            const words = [
                "C • C++ • Java • Python • JavaScript",
                "Frontend Developer",
                "JavaScript Developer",
                "Building Web Projects",
                "Web Developer"
            ];

            const typingElement = document.getElementById("typing");

            if (typingElement) {
                let wordIndex = 0;
                let charIndex = 0;
                let deleting = false;

                function typeEffect() {
                    const word = words[wordIndex];

                    if (!deleting) {
                        typingElement.textContent = word.substring(0, charIndex++);
                        if (charIndex > word.length) {
                            deleting = true;
                            setTimeout(typeEffect, 1500);
                            return;
                        }
                    } else {
                        typingElement.textContent = word.substring(0, charIndex--);
                        if (charIndex < 0) {
                            deleting = false;
                            wordIndex = (wordIndex + 1) % words.length;
                        }
                    }
                    setTimeout(typeEffect, deleting ? 50 : 120);
                }
                typeEffect();
            }
        });

        window.addEventListener("pageshow", function () {
            const loader = document.getElementById("loader");
            if (loader) loader.style.display = "none";
        });
    </script>
</body>

</html>
