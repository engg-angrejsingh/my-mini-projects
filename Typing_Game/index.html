<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cyberpunk Typer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="monitor">
        <header>
            <h1>Typing Game</h1>
            <div class="stats">
                <div id="timer">00:60</div>
                <div id="wpm-box" class="wpm-display">WPM: <span id="wpm-val">0</span></div>
            </div>
        </header>

        <div id="game" tabindex="0">
            <div id="words"></div>
            <div id="cursor"></div>
            <div id="focus-overlay">CLICK TO OVERRIDE SYSTEM</div>
        </div>

        <div class="controls">
            <button id="restart-btn" onclick="initGame()">Reboot Sequence</button>
        </div>
    </div>

   <script src="script.js"></script>
</body>
</html>
